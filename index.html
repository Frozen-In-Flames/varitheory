.g{display:grid;gap:4px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:6px}
#toast{min-height:22px;margin-bottom:10px;font-weight:600}.ok{color:var(--g)}.bad{color:var(--r)}
input[type=range]{accent-color:var(--c)}select,textarea{background:var(--b);color:var(--t);border:1px solid #334155;border-radius:8px;padding:6px}
textarea{width:100%;min-height:90px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--b);padding:4px;text-align:left}
